# Local full stack: `docker compose up --build`
# web → http://localhost:3000, api → http://localhost:4000
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: prompters, POSTGRES_PASSWORD: prompters, POSTGRES_DB: prompters }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U prompters"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://prompters:prompters@postgres:5432/prompters
      DIRECT_URL: postgresql://prompters:prompters@postgres:5432/prompters
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      SANDBOX_DRIVER: docker
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  worker:
    build: ./backend
    command: ["node", "dist/src/workers/index.js"]
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://prompters:prompters@postgres:5432/prompters
      DIRECT_URL: postgresql://prompters:prompters@postgres:5432/prompters
      REDIS_URL: redis://redis:6379
      SANDBOX_DRIVER: docker
    # The worker starts sibling sandbox containers through the host Docker daemon.
    # Mounting the socket gives this container host-level Docker access: run the worker
    # on a dedicated, isolated node in production (or use gVisor/Firecracker).
    user: root
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on: [api]

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://api:4000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
