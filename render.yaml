# Render Blueprint: the Prompters API on the free plan.
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on first deploy.
# Full guide and every variable: docs/DEPLOY.md
services:
  - type: web
    name: prompters-api
    runtime: node
    plan: free
    region: singapore # same region as the Neon database (ap-southeast-1)
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # Applies pending migrations, then starts the API (with the background workers inside it).
    startCommand: npx prisma migrate deploy && node dist/src/server/index.js
    # Liveness, not readiness: a Redis or database blip should not make Render restart the service.
    healthCheckPath: /live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Free plan has no background-worker service: run the workers inside the API.
      - key: RUN_WORKERS_IN_API
        value: "true"
      # Browser → Vercel rewrite → Render proxy → API: two proxies in front.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # No Docker on Render's free plan: user code never runs (build tasks / coding turns are off).
      - key: SANDBOX_DRIVER
        value: disabled
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: DIRECT_URL # Neon direct (unpooled) connection string, for migrations
        sync: false
      - key: REDIS_URL # rediss://... (Upstash over TCP, or a Render Key Value internal URL)
        sync: false
      - key: CORS_ORIGIN # your Vercel URL, e.g. https://prompters.vercel.app
        sync: false
      - key: APP_URL # same Vercel URL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-flash-latest
      - key: AI_FALLBACK_MODELS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite
      - key: AI_API_KEY # Gemini API key from Google AI Studio
        sync: false
      - key: GOOGLE_CLIENT_ID # optional: Google sign-in
        sync: false
      # Manisha's cloud voice — off until verified with real providers (docs/DEPLOY.md).
      # To enable: set STT_PROVIDER=deepgram / TTS_PROVIDER=elevenlabs and the keys below.
      - key: STT_PROVIDER
        value: browser
      - key: DEEPGRAM_API_KEY # optional
        sync: false
      - key: TTS_PROVIDER
        value: browser
      - key: ELEVENLABS_API_KEY # optional
        sync: false
      - key: ELEVENLABS_VOICE_ID # optional; needed with ELEVENLABS_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT # e.g. https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
